<!-- Cambio de contraseña del propio usuario (INNPACK y Faret). Reutiliza las clases .auth-* de
     faret.css (cargado global en index.html), igual que faret-login. Modo forzado (clave
     temporal / nunca cambiada / vencida): sin sidebar, sin "Volver", con "Cerrar sesión". -->
<div class="auth-page cambiar-password-module">
    <div class="auth-card">

        <div class="auth-header">
            <h2>Cambiar contraseña</h2>
            <p id="cp-subtitulo">Define una contraseña nueva para tu usuario</p>
        </div>

        <div id="cp-motivo" style="display:none; margin-bottom:16px; padding:10px 14px; border-radius:10px; background:#FFFBEB; color:#92400E; font-size:13px; font-weight:600;"></div>

        <form id="cp-form" class="auth-form" novalidate>
            <div class="auth-field">
                <label for="cp-actual">Contraseña actual</label>
                <input type="password" id="cp-actual" name="passwordActual" placeholder="Tu contraseña actual"
                    autocomplete="current-password" maxlength="100" required />
            </div>

            <div class="auth-field">
                <label for="cp-nueva">Contraseña nueva</label>
                <input type="password" id="cp-nueva" name="passwordNueva" placeholder="Nueva contraseña"
                    autocomplete="new-password" maxlength="100" required />
            </div>

            <div class="auth-field">
                <label for="cp-repetir">Repetir contraseña nueva</label>
                <input type="password" id="cp-repetir" name="passwordRepetir" placeholder="Repite la nueva contraseña"
                    autocomplete="new-password" maxlength="100" required />
            </div>

            <div class="auth-field" style="flex-direction: row; align-items: center; gap: 8px;">
                <input type="checkbox" id="cp-mostrar" style="width: auto;">
                <label for="cp-mostrar" style="margin: 0;">Mostrar contraseñas</label>
            </div>

            <p id="cp-reglas" style="margin:0; font-size:12px; color:#6b7280; line-height:1.5;"></p>

            <button type="submit" id="cp-guardar" class="auth-submit-btn">
                Guardar contraseña nueva
            </button>

            <div id="cp-message" class="auth-message" aria-live="polite"></div>
        </form>

        <div class="auth-back-wrap" id="cp-volver-wrap">
            <button id="cp-volver" class="auth-back-btn" type="button">← Volver</button>
        </div>

        <div class="auth-back-wrap" id="cp-salir-wrap" style="display:none;">
            <button id="cp-salir" class="auth-back-btn" type="button">Cerrar sesión</button>
        </div>

    </div>
</div>
